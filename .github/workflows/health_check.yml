name: Periodic health check

on:
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://bloglist-cicd-9kiw.onrender.com
          max-attempts: 3
          retry-delay: 5s